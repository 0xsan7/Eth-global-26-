services:
  - type: web
    name: briefmint
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    disk:
      name: briefmint-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/tool-city.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_ENABLE_DEV_FIXTURES
        value: "false"
